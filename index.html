<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Riu & Sucre</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* EVITAR SCROLL Y MOVIMIENTO */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Bloquea el scroll */
            background-color: #FFFFFF; /* Fondo blanco para integrar logo */
            font-family: -apple-system, system-ui, sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* CABECERA FIJA */
        .header {
            padding: 50px 20px 10px;
            text-align: center;
            flex-shrink: 0;
        }

        .app-logo {
            height: 80px;
            width: auto;
        }

        /* RESUMEN RÁPIDO */
        .summary {
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            background: #f8f8f8;
            margin: 0 20px;
            border-radius: 15px;
            flex-shrink: 0;
        }

        .dog-info { text-align: center; }
        .dog-info .name { font-size: 12px; color: #888; text-transform: uppercase; font-weight: bold; }
        .dog-info .weight { font-size: 20px; font-weight: bold; color: #333; }

        /* GRÁFICA OCUPANDO EL RESTO DEL ESPACIO */
        .chart-area {
            flex-grow: 1;
            padding: 20px;
            position: relative;
        }

        /* PANEL DE ACCIÓN INFERIOR */
        .actions {
            padding: 20px;
            background: #FFFFFF;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            padding-bottom: 40px; /* Espacio para barra de iPhone */
        }

        input {
            flex-grow: 1;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #ddd;
            font-size: 18px;
            background: #f9f9f9;
        }

        select {
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #ddd;
            background: #f9f9f9;
            font-weight: bold;
        }

        .btn-add {
            background: #007AFF;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
        }

        /* ESTADO CARGANDO */
        #loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
    </style>
</head>
<body>

<div id="loading-overlay">Cargando datos...</div>

<div class="header">
    <img src="logo.png" alt="Riu & Sucre" class="app-logo">
</div>

<div class="summary">
    <div class="dog-info">
        <div class="name" style="color: #8B4513;">Riu</div>
        <div class="weight" id="w-riu">-- kg</div>
    </div>
    <div class="dog-info">
        <div class="name" style="color: #1C1C1E;">Sucre</div>
        <div class="weight" id="w-sucre">-- kg</div>
    </div>
</div>

<div class="chart-area">
    <canvas id="weightChart"></canvas>
</div>

<div class="actions">
    <select id="sel-dog">
        <option value="Riu">Riu</option>
        <option value="Sucre">Sucre</option>
    </select>
    <input type="number" id="inp-weight" step="0.1" inputmode="decimal" placeholder="0.0 kg">
    <button class="btn-add" onclick="save()">Añadir</button>
</div>

<script>
    const URL = "https://script.google.com/macros/s/AKfycbyo31rwoDqHta-3-OfvXMPHmZyq70lWwxi7VT1zEQbHSjOnK_F1SC93PVO5U4XduNf50A/exec";
    let chart;

    window.onload = load;

    async function load() {
        try {
            const res = await fetch(URL);
            const data = await res.json();
            render(data);
            document.getElementById('loading-overlay').style.display = 'none';
        } catch (e) { alert("Error cargando datos"); }
    }

    function render(data) {
        const ds = {
            Riu: { label: 'Riu', data: [], borderColor: '#8B4513', backgroundColor: '#8B4513', tension: 0.4, pointRadius: 4, hitRadius: 30 },
            Sucre: { label: 'Sucre', data: [], borderColor: '#1C1C1E', backgroundColor: '#1C1C1E', tension: 0.4, pointRadius: 4, hitRadius: 30 }
        };

        data.forEach(d => {
            if(ds[d.perro]) {
                ds[d.perro].data.push({ x: new Date(d.fecha).toLocaleDateString('es-ES', {day:'numeric', month:'short'}), y: d.peso, edad: d.edad });
            }
        });

        // Actualizar pesos arriba con el último dato
        const lastRiu = data.filter(d => d.perro === 'Riu').pop();
        const lastSucre = data.filter(d => d.perro === 'Sucre').pop();
        if(lastRiu) document.getElementById('w-riu').innerText = lastRiu.peso + " kg";
        if(lastSucre) document.getElementById('w-sucre').innerText = lastSucre.peso + " kg";

        const ctx = document.getElementById('weightChart').getContext('2d');
        if(chart) chart.destroy();

        chart = new Chart(ctx, {
            type: 'line',
            data: { datasets: Object.values(ds) },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index', // AGRUPA DATOS: Al tocar cualquier parte vertical, muestra ambos perros
                    intersect: false
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        enabled: true,
                        backgroundColor: 'rgba(255,255,255,0.9)',
                        titleColor: '#000',
                        bodyColor: '#333',
                        padding: 12,
                        cornerRadius: 10,
                        displayColors: true,
                        callbacks: {
                            label: (c) => ` ${c.dataset.label}: ${c.raw.y}kg (${c.raw.edad})`
                        }
                    }
                },
                scales: {
                    y: { position: 'right', grid: { color: '#f0f0f0' } },
                    x: { grid: { display: false } }
                }
            }
        });
    }

    async function save() {
        const p = document.getElementById('sel-dog').value;
        const w = document.getElementById('inp-weight').value;
        if(!w) return;

        document.getElementById('loading-overlay').style.display = 'flex';
        document.getElementById('loading-overlay').innerText = "Guardando...";

        try {
            await fetch(URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ perro: p, peso: parseFloat(w) }) });
            document.getElementById('inp-weight').value = "";
            load(); // Recarga todo para ver el nuevo punto
        } catch (e) {
            alert("Error al guardar");
            document.getElementById('loading-overlay').style.display = 'none';
        }
    }
</script>
</body>
</html>
