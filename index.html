<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Riu & Sucre</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --riu-color: #8B4513;
            --sucre-color: #1C1C1E;
            --ios-bg: #FFFFFF;
        }

        /* BLOQUEO TOTAL DE MOVIMIENTO */
        html, body {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            overflow: hidden;
            background-color: var(--ios-bg);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex; flex-direction: column;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* LOADER CHAPA 3D DETALLADA */
        #loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #FFFFFF; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.4s ease;
        }

        .chapa-container {
            width: 120px; height: 120px;
            perspective: 600px;
        }

        .chapa {
            width: 100%; height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: flipChapa 2s infinite linear;
        }

        .face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 50%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            border: 4px solid #C0C0C0; /* Efecto metal */
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
        }

        .face-riu {
            background: linear-gradient(135deg, #A0522D, #8B4513);
            color: white;
        }

        .face-sucre {
            background: #1C1C1E;
            color: white;
            transform: rotateY(180deg);
        }

        /* Detalles Sucre (Pintas) */
        .spot { position: absolute; background: white; border-radius: 50%; opacity: 0.8; }

        .chapa-name { font-weight: 800; font-size: 14px; letter-spacing: 1px; margin-top: 5px; }
        .chapa-ring { 
            position: absolute; top: 10px; width: 12px; height: 12px; 
            background: #FFFFFF; border-radius: 50%; border: 2px solid #C0C0C0;
        }

        @keyframes flipChapa {
            0% { transform: rotateY(0); }
            100% { transform: rotateY(360deg); }
        }

        /* ESTRUCTURA FIJA */
        .header { padding: calc(10px + env(safe-area-inset-top)) 20px 5px; text-align: center; flex-shrink: 0; }
        .app-logo { height: 60px; width: auto; mix-blend-mode: multiply; }

        .summary {
            display: flex; background: #F2F2F7; margin: 5px 20px;
            border-radius: 14px; padding: 12px 0; flex-shrink: 0;
        }
        .dog-info { text-align: center; width: 50%; }
        .dog-info .weight { font-size: 18px; font-weight: 800; }
        .dog-info .name { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #8E8E93; }

        .chart-area { flex-grow: 1; padding: 5px 15px; min-height: 0; }

        /* ACCIONES OPTIMIZADAS IPHONE 15 PRO */
        .actions {
            background: #FFFFFF; border-top: 1px solid #E5E5EA;
            padding: 15px 20px calc(25px + env(safe-area-inset-bottom));
            flex-shrink: 0; display: flex; flex-direction: column; gap: 12px;
        }

        /* TOGGLE ESTILO IOS */
        .toggle-box {
            position: relative; background: #F2F2F7; border-radius: 12px;
            display: flex; height: 40px; padding: 2px;
        }
        .toggle-option {
            flex: 1; z-index: 2; display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 600; color: #8E8E93; transition: 0.3s;
        }
        .toggle-option.active { color: #000; }
        .slider {
            position: absolute; background: #FFF; width: calc(50% - 4px); height: 36px;
            top: 2px; left: 2px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1;
        }

        /* FILA DE ENTRADA COMPACTA */
        .input-group { display: flex; gap: 8px; align-items: center; }
        input {
            flex: 1; height: 44px; border-radius: 10px; border: none;
            background: #F2F2F7; font-size: 18px; font-weight: 600; text-align: center;
        }
        .btn-save {
            width: 40%; height: 44px; background: #007AFF; color: #FFF;
            border: none; border-radius: 10px; font-weight: 700; font-size: 15px;
        }
        .btn-save:active { opacity: 0.7; }
    </style>
</head>
<body>

<div id="loader-overlay">
    <div class="chapa-container">
        <div class="chapa">
            <div class="face face-riu">
                <div class="chapa-ring"></div>
                <span style="font-size:24px">🧔</span>
                <div class="chapa-name">RIU</div>
            </div>
            <div class="face face-sucre">
                <div class="chapa-ring"></div>
                <div class="spot" style="top:30%; left:20%; width:10px; height:10px;"></div>
                <div class="spot" style="top:60%; left:70%; width:15px; height:15px;"></div>
                <div class="spot" style="top:80%; left:40%; width:8px; height:8px;"></div>
                <span style="font-size:24px">🐶</span>
                <div class="chapa-name">SUCRE</div>
            </div>
        </div>
    </div>
    <div style="margin-top:20px; color:#8E8E93; font-weight:600; font-size:12px; letter-spacing:1px;">SINCRONIZANDO...</div>
</div>

<div class="header">
    <img src="logo.png" alt="Riu & Sucre" class="app-logo">
</div>

<div class="summary">
    <div class="dog-info">
        <div class="name" style="color:var(--riu-color)">Riu</div>
        <div id="w-riu" class="weight">-- kg</div>
    </div>
    <div class="dog-info" style="border-left:1px solid #D1D1D6">
        <div class="name" style="color:var(--sucre-color)">Sucre</div>
        <div id="w-sucre" class="weight">-- kg</div>
    </div>
</div>

<div class="chart-area">
    <canvas id="weightChart"></canvas>
</div>

<div class="actions">
    <div class="toggle-box" onclick="toggleDog()">
        <div id="slider" class="slider"></div>
        <div id="opt-riu" class="toggle-option active">RIU</div>
        <div id="opt-sucre" class="toggle-option">SUCRE</div>
    </div>
    <div class="input-group">
        <input type="number" id="inp-w" step="0.1" inputmode="decimal" placeholder="0.0">
        <button class="btn-save" onclick="save()">GUARDAR</button>
    </div>
</div>

<script>
    const URL = "https://script.google.com/macros/s/AKfycbyo31rwoDqHta-3-OfvXMPHmZyq70lWwxi7VT1zEQbHSjOnK_F1SC93PVO5U4XduNf50A/exec";
    let chart, selectedDog = "Riu";

    window.onload = load;

    function toggleDog() {
        selectedDog = (selectedDog === "Riu") ? "Sucre" : "Riu";
        document.getElementById('slider').style.transform = selectedDog === "Riu" ? "translateX(0)" : "translateX(100%)";
        document.getElementById('opt-riu').classList.toggle('active');
        document.getElementById('opt-sucre').classList.toggle('active');
    }

    async function load() {
        try {
            const res = await fetch(URL);
            const data = await res.json();
            render(data);
            const loader = document.getElementById('loader-overlay');
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 400);
        } catch (e) { console.error(e); }
    }

    function render(data) {
        const ds = {
            Riu: { label: 'Riu', data: [], borderColor: '#8B4513', backgroundColor: '#8B4513', tension: 0.4, pointRadius: 2 },
            Sucre: { label: 'Sucre', data: [], borderColor: '#1C1C1E', backgroundColor: '#1C1C1E', tension: 0.4, pointRadius: 2 }
        };
        data.forEach(d => {
            if(ds[d.perro]) ds[d.perro].data.push({ x: new Date(d.fecha).toLocaleDateString('es-ES',{day:'numeric',month:'short'}), y: d.weight || d.peso, edad: d.edad });
        });
        const lastR = data.filter(d => d.perro === 'Riu').pop();
        const lastS = data.filter(d => d.perro === 'Sucre').pop();
        if(lastR) document.getElementById('w-riu').innerText = lastR.peso + " kg";
        if(lastS) document.getElementById('w-sucre').innerText = lastS.peso + " kg";

        const ctx = document.getElementById('weightChart').getContext('2d');
        if(chart) chart.destroy();
        chart = new Chart(ctx, {
            type: 'line',
            data: { datasets: Object.values(ds) },
            options: {
                responsive: true, maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: { legend: { display: false } },
                scales: { 
                    y: { position: 'right', grid: { color: '#F2F2F7' } },
                    x: { grid: { display: false } }
                }
            }
        });
    }

    async function save() {
        const w = document.getElementById('inp-w').value;
        if(!w) return;
        const loader = document.getElementById('loader-overlay');
        loader.style.display = 'flex'; loader.style.opacity = '1';
        try {
            await fetch(URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ perro: selectedDog, peso: parseFloat(w) }) });
            document.getElementById('inp-w').value = "";
            load();
        } catch (e) { alert("Error"); loader.style.display = 'none'; }
    }
</script>
</body>
</html>
